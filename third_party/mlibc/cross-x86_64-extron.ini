# mlibc cross file for x86_64-extron using the host GCC (no custom target
# triplet needed: the sysroot + -nostdinc/-nostdlib supply everything).
[binaries]
c = 'gcc'
cpp = 'g++'
ar = 'ar'
strip = 'strip'

[built-in options]
default_library = 'both'
# GCC marks C++ template statics STB_GNU_UNIQUE by default; tcc's linker does not know that
# binding and rejects libc.a with "defined twice". Plain weak symbols link everywhere.
cpp_args = ['-fno-gnu-unique']

[project options]
libgcc_dependency = true

[host_machine]
system = 'extron'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
