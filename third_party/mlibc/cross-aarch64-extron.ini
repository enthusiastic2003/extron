[binaries]
c = 'aarch64-extron-gcc'
cpp = 'aarch64-extron-g++'
ar = 'aarch64-extron-ar'
strip = 'aarch64-extron-strip'

[built-in options]
default_library = 'both'
c_link_args = ['-L/home/sirjanh/extron-toolkit/toolchain/lib/gcc/aarch64-extron/16.2.0']
cpp_link_args = ['-L/home/sirjanh/extron-toolkit/toolchain/lib/gcc/aarch64-extron/16.2.0']

[project options]
libgcc_dependency = true

[host_machine]
system = 'extron'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
